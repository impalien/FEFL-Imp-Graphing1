<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Football Chart Maker</title>
<style>
:root{--bg:#0b0e14;--p:#141923;--b:#262d3a;--t:#e8ecf2;--m:#8b95a5;--a:#00ff99;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1200px;margin:0 auto;padding:12px;display:grid;gap:12px}
@media(min-width:900px){main{grid-template-columns:1fr 440px;align-items:start}#cw{position:sticky;top:12px}}
canvas{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--b)}
details{background:var(--p);border:1px solid var(--b);border-radius:10px;margin-bottom:10px}
details[hidden]{display:none}
summary{padding:12px 14px;font-weight:700;cursor:pointer}
.in{padding:0 14px 14px}
label{display:block;font-size:12px;color:var(--m);margin:8px 0 3px}
input,select,textarea{width:100%;background:#0b0e14;color:var(--t);border:1px solid var(--b);border-radius:8px;padding:9px;font:inherit;min-width:0}
input[type=checkbox]{width:auto}
input[type=color]{padding:2px;height:36px;width:44px;flex:none}
input[type=range]{padding:0}
.r{display:flex;gap:8px;align-items:flex-end}.r>*{flex:1;min-width:0}
.ck{display:flex;align-items:center;gap:6px;color:var(--t);font-size:14px}
.dl{width:64px;margin:0;font-size:13px;color:var(--m)}
button{background:#1d2431;color:var(--t);border:1px solid var(--b);border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}
.pri{background:var(--a);color:#04140c;font-weight:700;border:0}
.seg{display:flex;gap:8px;margin-bottom:10px}.seg button{flex:1}.seg .on{background:var(--a);color:#04140c;font-weight:700;border-color:var(--a)}
.card{border:1px solid var(--b);border-radius:10px;padding:10px;margin-top:10px;background:#10151e}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.sw{width:26px;height:26px;border-radius:50%;padding:0;flex:none;border:2px solid #fff4}
.hint{font-size:12px;color:#ffb020;margin-top:8px}
#ov{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:16px;z-index:9}
#ov img{max-width:100%;max-height:78%;border-radius:8px}
</style></head><body>
<div id="nojs" style="background:#ff2d55;color:#fff;padding:10px 14px;font:14px sans-serif">Scripts are blocked in this viewer, so the chart cannot load. Open the file in Chrome instead.</div>
<main>
<div id="cw"><canvas id="cv" width="2000" height="2200"></canvas><button class="pri" id="sv" style="width:100%;margin-top:10px">Save image</button></div>
<div>
<div class="seg" id="tp"><button data-t="scatter">Scatter</button><button data-t="bar">Bar</button><button data-t="radar">Radar</button></div>
<details open><summary>Players</summary><div class="in"><div class="r"><button class="pri" id="add">+ Add player</button><button id="clr" style="flex:none">Clear all</button></div><div id="pl"></div></div></details>
<details data-t="radar"><summary>Radar stats</summary><div class="in"><label>Each stat is one corner. Leave max blank to scale to the highest player.</label><div id="rm"></div><button class="pri" id="addm" style="margin-top:10px">+ Add stat</button></div></details>
<details data-t="scatter"><summary>Axes</summary><div class="in" id="ax"></div></details>
<details data-t="bar"><summary>Bars</summary><div class="in"><label>Value to plot</label><select data-k="bv"><option value="y">Y value</option><option value="x">X value</option></select><label>Order</label><select data-k="bs"><option value="desc">High to low</option><option value="asc">Low to high</option><option value="none">As entered</option></select><label>Axis label</label><input data-k="bl"><div class="r"><div><label>Min</label><input type="number" step="any" inputmode="decimal" data-n data-k="bmin" placeholder="auto"></div><div><label>Max</label><input type="number" step="any" inputmode="decimal" data-n data-k="bmax" placeholder="auto"></div></div></div></details>
<details data-t="scatter"><summary>Quadrants</summary><div class="in"><label class="ck"><input type="checkbox" data-k="quad"> Show quadrants and divider lines</label><label>Top left</label><input data-k="q0"><label>Top right</label><input data-k="q1"><label>Bottom left</label><input data-k="q2"><label>Bottom right</label><input data-k="q3"><label>Use / for a new line. Dividers sit at the average of the players (nudged off the dots) unless you set a divider value under Axes.</label></div></details>
<details><summary>Colours and legend</summary><div class="in"><label class="ck"><input type="checkbox" data-k="leg"> Show legend (radar shows a player key)</label><label>Legend title</label><input data-k="lt"><label>Position</label><select data-k="lp"><option value="bl">Bottom left</option><option value="br">Bottom right</option><option value="tl">Top left</option><option value="tr">Top right</option></select><label>Change a colour here and every dot using it updates. Clear a label to hide its row.</label><div id="pal"></div></div></details>
<details><summary>Text and style</summary><div class="in"><label>Title</label><input data-k="title"><label>Footnote (one line per row)</label><textarea rows="3" data-k="foot"></textarea><label>Dot size</label><input type="range" min="12" max="34" data-n data-k="ds"></div></details>
</div></main>
<div id="ov"><img id="oi" alt="Chart"><span style="color:#8b95a5">Long-press the image to save it</span><button id="cl">Close</button></div>

rows.forEach((r,ri)=>{let x=(W-r.reduce((s,o)=>s+o.w+34,-34))/2;const y=cy+rr+95+ri*44;
r.forEach(o=>{const rd=12,d=rd*.72;if(o.p.two){dot(x+rd,y,rd,o.p.c1);dot(x+rd+2*d,y,rd,o.p.c2)}else dot(x+rd,y,rd,o.p.c1);
c.fillStyle='#fff';c.textAlign='left';c.textBaseline='middle';c.font='bold 26px '+F;c.fillText(nm(o.p),x+sw(o.p)+14,y);x+=o.w+34})})}}
function draw(){
c.setTransform(2,0,0,2,0,0);c.setLineDash([]);c.fillStyle='#0b0e14';c.fillRect(0,0,W,H);
c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff';ft(S.title,W/2,52,W-60,46,'bold ');
try{({scatter:dScatter,bar:dBar,radar:dRadar}[S.type]||dScatter)()}catch(e){c.setLineDash([]);c.fillStyle='#ff2d55';c.textAlign='center';c.textBaseline='middle';ft('Chart error: '+e.message,W/2,(T+B)/2,W-80,26,'bold ')}
const fl=String(nz(S.foot,'')).split('\n').filter(s=>s.trim());c.fillStyle='#8b95a5';c.textAlign='center';c.textBaseline='middle';
fl.forEach((s,k)=>ft(s,W/2,H-16-(fl.length-1-k)*28,W-50,21))}
const go=()=>{draw();try{localStorage.setItem('fsm1',JSON.stringify(S))}catch(e){}},
ok=p=>S.type=='radar'?p.v.some(v=>v!=null):S.type=='bar'?p[S.bv]!=null:p.x!=null&&p.y!=null,
sync=()=>document.querySelectorAll('[data-k]').forEach(e=>{const k=e.dataset.k;if(e.type=='checkbox')e.checked=!!S[k];else e.value=nz(S[k],'')}),
dr=(i,k,p)=>{const n=S.type=='radar'?['Colour','Points']:['Dot 1','Dot 2'];
return '<div class="dr">'+(k==1?'<b class="dl">'+n[0]+'</b>':'<label class="ck dl"><input type="checkbox" data-i="'+i+'" data-f="two"'+(p.two?' checked':'')+'>'+n[1]+'</label>')+S.pal.map(q=>'<button class="sw" style="background:'+q.c+'" data-i="'+i+'" data-f="c'+k+'" data-v="'+q.c+'"></button>').join('')+'<input type="color" value="'+esc(p['c'+k])+'" data-i="'+i+'" data-f="c'+k+'"></div>'},
num=(i,p,f,t)=>'<div><label>'+t+'</label><input type="number" step="any" inputmode="decimal" data-i="'+i+'" data-f="'+f+'" value="'+esc(p[f])+'"></div>',
body=(i,p)=>{if(S.type=='radar')return '<div class="g">'+S.metrics.map((m,j)=>'<div><label>'+esc(m.n)+'</label><input type="number" step="any" inputmode="decimal" data-i="'+i+'" data-j="'+j+'" data-f="v" value="'+esc(p.v[j])+'"></div>').join('')+'</div>';
if(S.type=='bar')return '<div class="r">'+num(i,p,S.bv,'Value ('+S.bv.toUpperCase()+')')+'</div>';
return '<div class="r">'+num(i,p,'x','X')+num(i,p,'y','Y')+'<div><label>Name</label><select data-i="'+i+'" data-f="pos">'+POS.map(o=>'<option value="'+o[0]+'"'+(p.pos==o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></div></div>'};
function cards(){pl.innerHTML=S.players.map((p,i)=>'<div class="card"><div class="r"><input data-i="'+i+'" data-f="n" value="'+esc(p.n)+'" placeholder="Player name"><button data-del="'+i+'" style="flex:none">&#10005;</button></div>'+body(i,p)+dr(i,1,p)+dr(i,2,p)+'<div class="hint"'+(ok(p)?' hidden':'')+'>Fill in the numbers to show this player on the chart.</div></div>').join('')}
function rmr(){rm.innerHTML=S.metrics.map((m,j)=>'<div class="r" style="margin-top:8px"><input data-m="'+j+'" data-f="n" value="'+esc(m.n)+'" placeholder="Stat name"><input type="number" step="any" inputmode="decimal" data-m="'+j+'" data-f="m" value="'+esc(m.m)+'" placeholder="max (auto)"><button data-md="'+j+'" style="flex:none">&#10005;</button></div>').join('')}
function ui(){tp.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t==S.type));document.querySelectorAll('details[data-t]').forEach(d=>{d.hidden=d.dataset.t.indexOf(S.type)<0})}
pl.oninput=e=>{const t=e.target,i=t.dataset.i;if(i==null||!S.players[i])return;const p=S.players[i],f=t.dataset.f,v=t.type=='checkbox'?t.checked:t.type=='number'?(t.value===''?null:+t.value):t.value;
if(f=='v'){while(p.v.length<=+t.dataset.j)p.v.push(null);p.v[+t.dataset.j]=v}else p[f]=v;
const h=t.closest('.card').querySelector('.hint');if(h)h.hidden=ok(p);go()};
pl.onclick=e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.del!=null)S.players.splice(+t.dataset.del,1);else if(t.dataset.v&&S.players[t.dataset.i])S.players[t.dataset.i][t.dataset.f]=t.dataset.v;else return;cards();go()};
add.onclick=()=>{S.players.unshift({n:'',x:null,y:null,c1:S.pal[1].c,c2:S.pal[1].c,two:true,pos:'t',v:[]});cards();go();const f=pl.querySelector('input[data-f=n]');if(f){f.scrollIntoView({block:'center'});f.focus()}};
clr.onclick=()=>{if(clr.dataset.s){S.players=[];S.xmin=S.xmax=S.ymin=S.ymax=S.xs=S.ys=S.bmin=S.bmax=null;sync();cards();go();clr.textContent='Clear all';delete clr.dataset.s}else{clr.dataset.s=1;clr.textContent='Tap again to clear';setTimeout(()=>{delete clr.dataset.s;clr.textContent='Clear all'},3000)}};
rm.oninput=e=>{const t=e.target,j=t.dataset.m;if(j==null||!S.metrics[j])return;if(t.dataset.f=='m')S.metrics[j].m=t.value===''?null:+t.value;else{S.metrics[j].n=t.value;cards()}go()};
rm.onclick=e=>{const t=e.target.closest('button');if(!t||t.dataset.md==null)return;const j=+t.dataset.md;S.metrics.splice(j,1);S.players.forEach(p=>p.v.splice(j,1));rmr();cards();go()};
addm.onclick=()=>{if(S.metrics.length>=12)return;S.metrics.push({n:'Stat '+(S.metrics.length+1),m:null});rmr();cards();go()};
tp.onclick=e=>{const t=e.target.closest('button');if(!t||!t.dataset.t)return;S.type=t.dataset.t;ui();cards();go()};
ax.innerHTML=['x','y'].map(a=>'<label>'+a.toUpperCase()+' axis label</label><input data-k="'+a+'l"><div class="r">'+[['min','Min','auto'],['max','Max','auto'],['s','Divider','avg']].map(q=>'<div><label>'+q[1]+'</label><input type="number" step="any" inputmode="decimal" data-n data-k="'+a+q[0]+'" placeholder="'+q[2]+'"></div>').join('')+'</div><label class="ck"><input type="checkbox" data-k="'+a+'rev"> Flip '+a.toUpperCase()+' axis (low values '+(a=='x'?'on the right':'at the top')+')</label>').join('<hr style="border:0;border-top:1px solid var(--b);margin:14px 0">');
document.querySelectorAll('[data-k]').forEach(e=>{e.oninput=()=>{const k=e.dataset.k;S[k]=e.type=='checkbox'?e.checked:'n' in e.dataset?(e.value===''?null:+e.value):e.value;if(k=='bv')cards();go()}});
pal.innerHTML=S.pal.map((q,i)=>'<div class="r" style="margin-top:8px"><input type="color" data-p="'+i+'" value="'+esc(q.c)+'"><input data-p="'+i+'" value="'+esc(q.l)+'" placeholder="Legend label"></div>').join('');
pal.oninput=e=>{const t=e.target,i=t.dataset.p;if(i==null||!S.pal[i])return;const q=S.pal[i];if(t.type=='color'){S.players.forEach(p=>['c1','c2'].forEach(k=>{if(p[k]==q.c)p[k]=t.value}));q.c=t.value;cards()}else q.l=t.value;go()};
sv.onclick=()=>{oi.src=cv.toDataURL('image/png');ov.style.display='flex'};cl.onclick=()=>{ov.style.display='none'};
sync();ui();cards();rmr();draw();
</script></body></html>
