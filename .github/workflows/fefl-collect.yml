name: FEFL collector

on:
  schedule:
    - cron: '0 */6 * * *'                 # normal: every 6 hours
    - cron: '*/30 11-22 * * 0,2,3,5,6'    # matchdays (Sun, Tue, Wed, Fri, Sat, UTC): wake every 30 minutes
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a collection even if one is not due'
        type: boolean
        default: false

concurrency:
  group: fefl-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fefl-collector   # the folder you uploaded
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Collect (the script decides whether a collection is actually due)
        run: npx tsx src/run.ts ${{ inputs.force && '--force' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OUT_FILE: ../data/fefl-stats.json   # lands in the data folder at the top of your repository, next to players.json
      - name: Publish data/fefl-stats.json to the website
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "fefl-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/fefl-stats.json || true
          if git diff --cached --quiet; then echo "No change to publish"; else
            git commit -m "data: FEFL stats $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
