name: Update EFL stats

on:
  schedule:
    - cron: "30 22 * * 1,5"   # Monday and Friday, 22:30 UTC
  workflow_dispatch:           # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: efl-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache soccerdata downloads (makes later runs fast)
        uses: actions/cache@v4
        with:
          path: .soccerdata
          key: soccerdata-${{ github.run_id }}
          restore-keys: soccerdata-

      - run: python -m pip install --upgrade pip soccerdata pandas

      - name: Build data/efl_stats.json
        run: python build_efl_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/efl_stats.json
          git diff --cached --quiet || (git commit -m "Update EFL stats $(date -u +%F)" && git push)
