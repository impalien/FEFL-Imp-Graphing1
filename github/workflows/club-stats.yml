name: Club stats
on:
  schedule:
    - cron: "0 5 * * 1"   # every Monday at 05:00 UTC
  workflow_dispatch:       # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and work out club stats
        run: python scripts/club_stats.py
      - name: Save data/clubs.json if it changed
        run: |
          git config user.name "club-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/clubs.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Weekly club stats" && git push; fi
